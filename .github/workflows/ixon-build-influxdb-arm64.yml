
name: Build IXON InfluxDB ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-influxdb:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout IXON project
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build InfluxDB for ARM64/v8
        run: |
          docker buildx build \
            --platform linux/arm64/v8 \
            --file influxdb/Dockerfile \
            --tag influxdb:ixon-arm64-v8 \
            --output type=docker,dest=/tmp/influxdb.tar \
            ./influxdb

      - name: Compress Docker image
        run: gzip -1 /tmp/influxdb.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: ixon-influxdb-arm64-v8
          path: /tmp/influxdb.tar.gz
          retention-days: 7
          compression-level: 0
