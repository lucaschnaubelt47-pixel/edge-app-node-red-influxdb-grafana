
name: Build IXON Grafana ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-grafana:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout IXON project
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Grafana for ARM64/v8
        run: |
          docker buildx build \
            --platform linux/arm64/v8 \
            --file grafana/Dockerfile \
            --tag grafana:ixon-arm64-v8 \
            --output type=docker,dest=/tmp/grafana.tar \
            ./grafana

      - name: Compress Docker image
        run: gzip -1 /tmp/grafana.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: ixon-grafana-arm64-v8
          path: /tmp/grafana.tar.gz
          retention-days: 7
          compression-level: 0
